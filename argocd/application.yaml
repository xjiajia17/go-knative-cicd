apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-demo
  namespace: argocd
  # 删除 Application 时级联删除它管理的集群资源。
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/xjiajia17/go-knative-cicd.git
    targetRevision: main
    # 指向 kustomization.yaml 所在目录，Argo CD 内置 kustomize 渲染。
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true # Git 里删掉的资源，集群里也删
      selfHeal: false # 有人手改集群，自动改回 Git 的状态
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Knative controller 会自动给 Service 填 spec.traffic（流量分配），
  # 这不是 Git 里的内容。不忽略的话 Argo 会永远 OutOfSync 并和 controller 互相覆盖。
  ignoreDifferences:
    - group: serving.knative.dev
      kind: Service
      jsonPointers:
        - /spec/traffic
