apiVersion: v1
kind: ConfigMap
metadata:
  name: go-demo-dashboard
  # 放在 monitoring 命名空间：Grafana 的 dashboard sidecar 配置为 NAMESPACE=ALL，
  # 会扫描所有命名空间里带 grafana_dashboard=1 标签的 ConfigMap 并自动加载。
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  go-demo.json: |
    {
      "uid": "go-demo-cicd",
      "title": "Go Demo / CI-CD 与自定义指标",
      "tags": ["knative", "demo", "cicd"],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "访问量 QPS（demo_http_requests_total）",
          "description": "业务自定义计数器。缩容到 0 时无 Pod 可抓，曲线断档属正常现象。",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(demo_http_requests_total{namespace=\"demo\"}[1m]))",
              "legendFormat": "总 QPS"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (status) (rate(demo_http_requests_total{namespace=\"demo\"}[1m]))",
              "legendFormat": "status {{status}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "P95 延迟（秒）",
          "description": "用 ?delay=200 打流量可以看到这条线抬升。",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(demo_http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])) by (le))",
              "legendFormat": "P95"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(demo_http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])) by (le))",
              "legendFormat": "P50"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx 占比",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(demo_http_requests_total{namespace=\"demo\",status=~\"5..\"}[5m])) / sum(rate(demo_http_requests_total{namespace=\"demo\"}[5m]))",
              "legendFormat": "5xx 比例"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Running Pod 数（缩容到 0 可视化）",
          "description": "来自 kube-state-metrics。or vector(0) 保证无 Pod 时显示 0 而不是 No data。",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "decimals": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(kube_pod_status_phase{namespace=\"demo\",phase=\"Running\"}) or vector(0)",
              "legendFormat": "Running Pod"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "当前运行版本 / commit",
          "description": "发版后这里会变成新的 commit，是判断 CI-CD 是否真的生效最直观的一格。",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 16 },
          "options": { "textMode": "name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "demo_build_info{namespace=\"demo\"}",
              "legendFormat": "{{version}} / {{commit}}",
              "instant": true
            }
          ]
        }
      ]
    }