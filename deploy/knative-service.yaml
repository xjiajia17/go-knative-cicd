apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: go-demo
  namespace: demo
spec:
  template:
    metadata:
      annotations:
        # 缩容到 0 的核心开关：min-scale=0 表示无流量时允许把 Pod 全部干掉。
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        # 每个 Pod 期望承载的并发请求数，KPA 按 实际并发/目标 算期望副本数。
        autoscaling.knative.dev/target: "10"
        # 指标统计窗口；配合下面的 grace-period，空闲约 90s 后缩到 0。
        autoscaling.knative.dev/window: "60s"
        autoscaling.knative.dev/scale-to-zero-grace-period: "30s"
    spec:
      # 0 = 不限制单 Pod 并发，交给 KPA 按并发扩缩。
      containerConcurrency: 0
      timeoutSeconds: 30
      imagePullSecrets:
        - name: swr-cred
      containers:
        # 这个 image 值会被 kustomization.yaml 里的 images 覆盖，
        # CI 发版时只改 kustomization.yaml 的 newTag，不动本文件。
        - image: swr.cn-southwest-2.myhuaweicloud.com/bendi/go-knative-cicd:v0.1.0
          ports:
            # Knative 只允许一个端口，且名字必须是 http1（HTTP/1.1）或 h2c。
            # /metrics 与业务共用这个端口。
            - name: http1
              containerPort: 8080
          env:
            - name: TARGET
              value: "GitOps-Verified"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5